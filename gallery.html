<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noodle Animation Check</title>
<link rel="preload" href="fonts/it-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Inter Tight';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/it-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Inter Tight';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/it-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
</style>
<style>
:root{--ink:#161616;--mute:#595959;--line:#E4E4E4}
*{box-sizing:border-box}
body{margin:0;background:#FFFFFF;color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:#FFFFFF;border-bottom:3px solid var(--ink);padding:calc(14px + env(safe-area-inset-top)) 16px 12px}
h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.04em;line-height:1}
.sub{margin:6px 0 0;font-size:13px;color:var(--mute);line-height:1.35}
.bar{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.bar button,.bar a{height:36px;padding:0 12px;border:3px solid var(--ink);background:#FFFFFF;font:800 13px "Inter Tight",sans-serif;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--ink);color:#FFFFFF}
main{padding:8px 16px 40px;max-width:1100px;margin:0 auto}
h2{margin:26px 0 8px;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{border:3px solid var(--ink);padding:6px 6px 8px;position:relative;background:#FFFFFF}
.card.flag{border-color:#E5282E;box-shadow:0 0 0 3px #E5282E}
.num{position:absolute;left:0;top:0;background:var(--ink);color:#FFFFFF;font-size:11px;font-weight:900;padding:2px 6px}
.card svg{display:block;width:100%;height:auto;background:#F7F7F7}
.name{margin:6px 0 0;font-size:13px;font-weight:800;line-height:1.15}
.meta{margin:2px 0 0;font-size:11px;color:var(--mute)}
.flagbtn{margin-top:6px;width:100%;height:30px;border:2px solid var(--ink);background:#FFFFFF;font:800 11px "Inter Tight",sans-serif;color:var(--ink);cursor:pointer}
.card.flag .flagbtn{background:#E5282E;border-color:#E5282E;color:#FFFFFF}
.tricks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tr{border:3px solid var(--ink);padding:10px 6px 8px;text-align:center;position:relative}
.tr .stage{height:110px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;background:#F7F7F7}
.tr .stage span{display:block;transform-origin:50% 90%}
#report{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ink);color:#FFFFFF;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;gap:10px;align-items:center}
#report.on{display:flex}
#report p{margin:0;flex:1;font-size:13px;font-weight:700;line-height:1.3}
#report button{height:40px;padding:0 14px;border:0;background:#FFC20E;color:var(--ink);font:900 13px "Inter Tight",sans-serif;cursor:pointer}
</style>
<style id="trk"></style>
</head>
<body>
<header>
  <h1>Animation check</h1>
  <p class="sub">Every move in Noodle, numbered. Tap <b>Looks off</b> on any that look wrong, then copy the list and send it to Claude.</p>
  <div class="bar">
    <button id="slow" aria-pressed="false">Slow motion</button>
    <button id="onlyf" aria-pressed="false">Show flagged only</button>
    <a href="./">Back to Noodle</a>
  </div>
</header>
<main id="main"></main>
<div id="report"><p id="rtext"></p><button id="copy">Copy list</button></div>

<script>
window.DCLogic = function (props) { this.props = props || {}; this.state = {}; };
DCLogic.prototype.setState = function (u) { this.state = Object.assign({}, this.state, typeof u === 'function' ? u(this.state) : u); };
window.bootNoodle = function (C) { window.__C = C; };
</script>
<script src="app.js?v=51"></script>
<script>
(function () {
  var C = new window.__C({});
  var F = C.fams(), MI = C.moveInfo(), A = C.animRows();
  var KEY = 'noodle-dev-flags';
  var flags = {};
  try { flags = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  var slow = false, onlyFlag = false;
  var main = document.getElementById('main');

  function svgFor(name, k) {
    var f = C.figure(name, false);
    var dur = slow ? (parseFloat(f.dur) * 2.5) + 's' : f.dur;
    var sp = 'calcMode="spline" keyTimes="' + f.kt + '" keySplines="' + f.ks + '" repeatCount="indefinite" dur="' + dur + '"';
    var o = '<svg viewBox="0 0 100 100" role="img" aria-label="' + f.aria + '">';
    o += '<line x1="4" y1="90.5" x2="96" y2="90.5" stroke="#D9D9D9" stroke-width="2.4" stroke-linecap="round"/>';
    if (f.wo) o += '<line x1="' + f.wx + '" y1="6" x2="' + f.wx + '" y2="90.5" stroke="#CFCFCF" stroke-width="2.4"/>';
    if (f.bo) o += '<rect x="' + f.bx + '" y="' + f.by + '" width="' + f.bw + '" height="' + f.bh + '" rx="2" fill="#F0F0F0" stroke="#CFCFCF" stroke-width="1.6"/>';
    if (f.ro) o += '<line x1="' + f.rx1 + '" y1="' + f.ry + '" x2="' + f.rx2 + '" y2="' + f.ry + '" stroke="#8A8A8A" stroke-width="3" stroke-linecap="round"/>';
    for (var i = 0; i < 10; i++) {
      var s = f['s' + i];
      o += '<line x1="' + s.x1 + '" y1="' + s.y1 + '" x2="' + s.x2 + '" y2="' + s.y2 + '" stroke="' + s.c + '" stroke-width="' + s.w + '" stroke-linecap="round">' +
        '<animate attributeName="x1" values="' + s.ax1 + '" ' + sp + '/><animate attributeName="y1" values="' + s.ay1 + '" ' + sp + '/>' +
        '<animate attributeName="x2" values="' + s.ax2 + '" ' + sp + '/><animate attributeName="y2" values="' + s.ay2 + '" ' + sp + '/></line>';
    }
    o += '<circle cx="' + f.hx + '" cy="' + f.hy + '" r="6.5" fill="#161616"><animate attributeName="cx" values="' + f.ahx + '" ' + sp + '/><animate attributeName="cy" values="' + f.ahy + '" ' + sp + '/></circle>';
    return o + '</svg>';
  }

  var NOODLE = '<svg width="104" height="62" viewBox="0 0 220 130" aria-hidden="true" style="display:block;overflow:visible"><path d="M44 62 L14 34 L50 52 Z" fill="#161616"/><rect x="56" y="84" width="12" height="26" rx="6" fill="#161616"/><rect x="78" y="84" width="12" height="26" rx="6" fill="#161616"/><rect x="138" y="84" width="12" height="26" rx="6" fill="#161616"/><rect x="160" y="84" width="12" height="26" rx="6" fill="#161616"/><rect x="40" y="50" width="140" height="44" rx="22" fill="#E5282E"/><rect x="148" y="50" width="10" height="44" fill="#FFC20E"/><circle cx="176" cy="46" r="24" fill="#E5282E"/><path d="M188 38 h22 a10 10 0 0 1 0 20 h-22 z" fill="#E5282E"/><circle cx="211" cy="46" r="5" fill="#161616"/><ellipse cx="166" cy="56" rx="8" ry="16" fill="#161616"/><circle cx="184" cy="38" r="3.5" fill="#161616"/></svg>';

  // pull the trick keyframes from the app page so the gallery always matches
  fetch('./').then(function (r) { return r.text(); }).then(function (html) {
    var css = (html.match(/@keyframes tr\w+\{[^\n]*\}/g) || []).join('\n');
    document.getElementById('trk').textContent = css;
  }).catch(function () {});

  function render() {
    var T = C.tricks(), n = 0, html = '';
    var famKeys = Object.keys(F);
    var fl = Object.keys(flags);
    // tricks
    var tr = '<h2><span class="dot" style="background:#E5282E;border-radius:50%"></span>Noodle\'s tricks</h2><div class="tricks">';
    T.forEach(function (t, i) {
      var id = 'T' + (i + 1), on = !!flags[id];
      if (onlyFlag && !on) return;
      var d = t[3] * (slow ? 2.5 : 1);
      tr += '<div class="card tr' + (on ? ' flag' : '') + '"><span class="num">' + id + '</span><div class="stage"><span style="transform-origin:' + (t[4] || '50% 90%') + ';animation:' + t[2] + ' ' + d + 's cubic-bezier(.3,.7,.4,1) 0s infinite">' + NOODLE + '</span></div><p class="name">' + t[0] + '</p><p class="meta">Unlocks at ' + t[1] + ' level-ups</p><button class="flagbtn" data-id="' + id + '" data-name="Trick: ' + t[0] + '">' + (on ? 'Flagged' : 'Looks off') + '</button></div>';
    });
    html += tr + '</div>';
    famKeys.forEach(function (fk) {
      var moves = Object.keys(MI).filter(function (k) { return MI[k].fam === fk; });
      if (!moves.length) return;
      var sec = '';
      moves.forEach(function (name) {
        n++;
        var id = '#' + n, on = !!flags[id];
        if (onlyFlag && !on) return;
        var m = MI[name];
        var shared = Object.keys(MI).filter(function (k) { return MI[k].anim === m.anim; }).length;
        sec += '<div class="card' + (on ? ' flag' : '') + '"><span class="num">' + id + '</span>' + svgFor(name) + '<p class="name">' + name + '</p><p class="meta">' + ['Foundation', 'Beginner', 'Intermediate', 'Advanced', 'Pro'][m.lvl] + ' · ' + (m.anim || 'stand') + (shared > 1 ? ' (shared ×' + shared + ')' : '') + '</p><button class="flagbtn" data-id="' + id + '" data-name="' + name.replace(/"/g, '&quot;') + '">' + (on ? 'Flagged' : 'Looks off') + '</button></div>';
      });
      if (sec) html += '<h2><span class="dot" style="background:' + F[fk].color + '"></span>' + (F[fk].name || fk) + '</h2><div class="grid">' + sec + '</div>';
    });
    main.innerHTML = html || '<p class="sub" style="margin-top:20px">Nothing flagged yet.</p>';
    var r = document.getElementById('report');
    r.className = fl.length ? 'on' : '';
    document.getElementById('rtext').textContent = fl.length + ' flagged: ' + fl.map(function (k) { return k + ' ' + flags[k]; }).join(', ');
    document.body.style.paddingBottom = fl.length ? '80px' : '0';
  }

  main.addEventListener('click', function (e) {
    var b = e.target.closest('.flagbtn'); if (!b) return;
    var id = b.getAttribute('data-id');
    if (flags[id]) delete flags[id]; else flags[id] = b.getAttribute('data-name');
    try { localStorage.setItem(KEY, JSON.stringify(flags)); } catch (err) {}
    render();
  });
  document.getElementById('slow').onclick = function () { slow = !slow; this.setAttribute('aria-pressed', slow); render(); };
  document.getElementById('onlyf').onclick = function () { onlyFlag = !onlyFlag; this.setAttribute('aria-pressed', onlyFlag); render(); };
  document.getElementById('copy').onclick = function () {
    var t = 'Noodle animations that look off: ' + Object.keys(flags).map(function (k) { return k + ' ' + flags[k]; }).join(', ');
    var done = function () { var b = document.getElementById('copy'); b.textContent = 'Copied!'; setTimeout(function () { b.textContent = 'Copy list'; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, function () { prompt('Copy this:', t); });
    else prompt('Copy this:', t);
  };
  render();
})();
</script>
</body>
</html>
